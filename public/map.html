<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>8mart map</title><link rel="icon" href="data:,">
<!-- Карта MartMethodModal. Порт design_handoff_8mart_site/site/map.html.
     Встраивается iframe-ом; токен Mapbox (публичный pk.) приходит в query ?token= от родителя — в файле его нет.
     Адрес по пину — через наш сервер GET /api/geo/reverse (DaData / Mapbox), ключи DaData в браузер не попадают.
     Контракт сообщений:
       карта → родитель {src:'8mart-map', id, type:'ready'|'moving'|'address'|'pick'|'geo'|'error', …}
       (у 'pick' точка в pointId — id занят идентификатором карты; в референсе было id)
       родитель → карта {src:'8mart-parent', mode?, points?, selected?, lat?, lng?, zoom?, fit?, quiet?, locate?} -->
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<style>
@font-face{font-family:'Onest';font-style:normal;font-weight:400 800;font-display:swap;src:url('/fonts/onest-cyrillic.woff2') format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;}
@font-face{font-family:'Onest';font-style:normal;font-weight:400 800;font-display:swap;src:url('/fonts/onest-cyrillic-ext.woff2') format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;}
@font-face{font-family:'Onest';font-style:normal;font-weight:400 800;font-display:swap;src:url('/fonts/onest-latin.woff2') format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
/* Значения — 1:1 из site/map.html (iframe не видит tokens.css, поэтому литералы). */
html,body,#map{margin:0;height:100%;width:100%;background:#EEEDF1;font-family:Onest,system-ui,sans-serif}
.mapboxgl-ctrl-attrib{font-size:10px}
.me{width:14px;height:14px;border-radius:50%;background:#2F80ED;border:2px solid #fff;box-shadow:0 0 0 6px rgba(47,128,237,.2)}
#pin[hidden],#shadow[hidden],#fail[hidden]{display:none}
/* Пин доставки: головка 40 (розовый круг, белая обводка 3, мягкая тень) + игла 3×16 + тень на земле.
   Острие иглы — центр карты. Тянут карту — пин приподнимается на 10px, тень сжимается.
   Определяем адрес — белая точка в головке сменяется дугой-спиннером (SVG, центр головки — без смещения). */
#pin{position:absolute;left:50%;top:50%;width:46px;height:59px;margin:-59px 0 0 -23px;pointer-events:none;z-index:500;display:flex;flex-direction:column;align-items:center;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#pin.lift{transform:translateY(-10px)}
#pin .head{position:relative;flex:none;width:40px;height:40px;margin-top:3px;border-radius:50%;background:#EE1D74;box-shadow:0 0 0 3px #fff,0 8px 20px rgba(238,29,116,.35),0 2px 6px rgba(23,21,26,.18);display:flex;align-items:center;justify-content:center}
#pin .dot{width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .18s ease,opacity .18s ease}
#pin .spin{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;opacity:0;transition:opacity .18s ease}
#pin .spin circle{fill:none;stroke-width:2.5;stroke-linecap:round}
#pin .spin .track{stroke:rgba(255,255,255,.3)}
#pin .spin .arc{stroke:#fff;stroke-dasharray:16 41}
#pin.busy .dot{transform:scale(.3);opacity:0}
#pin.busy .spin{opacity:1;animation:spin .8s linear infinite}
#pin .leg{width:3px;height:16px;border-radius:0 0 1.5px 1.5px;background:#17151A}
#shadow{position:absolute;left:50%;top:50%;width:16px;height:6px;margin:-3px 0 0 -8px;border-radius:50%;background:rgba(23,21,26,.3);filter:blur(1.5px);z-index:499;pointer-events:none;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s ease}
#shadow.lift{transform:scale(.6);opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){#pin,#shadow,#pin .dot{transition:none}#pin.busy .spin{animation-duration:1.6s}}
.pp{width:36px;height:36px;border-radius:50%;background:#fff;border:2.5px solid #EE1D74;box-sizing:border-box;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(23,21,26,.18);cursor:pointer;transition:transform .15s ease;padding:0}
.pp span{width:12px;height:12px;border-radius:50%;background:#EE1D74}
.pp.sel{background:#EE1D74;transform:scale(1.15)}
.pp.sel span{background:#fff}
.pp:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(238,29,116,.18),0 4px 12px rgba(23,21,26,.18)}
#ctl{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:8px;z-index:600}
body.compact #ctl{bottom:32px;gap:6px}
/* Mobile: панель модалки заходит на карту на 20px — логотип и атрибуция Mapbox должны оставаться видны. */
body.compact .mapboxgl-ctrl-bottom-left,body.compact .mapboxgl-ctrl-bottom-right{bottom:20px}
body.compact #ctl button{width:40px;height:40px}
body.compact #zin,body.compact #zout{display:none}
#ctl button{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px rgba(23,21,26,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s ease}
#ctl button:hover{background:#F7F7F8}
#ctl button:focus{outline:none}
#ctl button:focus-visible{box-shadow:0 0 0 3px rgba(238,29,116,.18),0 4px 12px rgba(23,21,26,.15)}
#ctl .h{width:14px;height:2.5px;background:#17151A;border-radius:1px}
#ctl .v{position:absolute;width:2.5px;height:14px;background:#17151A;border-radius:1px}
#locate i{width:16px;height:16px;border:2.5px solid #17151A;border-radius:50%;box-sizing:border-box;position:relative;display:block}
#locate i:after{content:"";position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#17151A}
#locate b{position:absolute;background:#17151A;border-radius:1px}
#locate b.n{left:50%;top:7px;width:2.5px;height:6px;margin-left:-1.25px}
#locate b.s{left:50%;bottom:7px;width:2.5px;height:6px;margin-left:-1.25px}
#locate b.w{left:7px;top:50%;width:6px;height:2.5px;margin-top:-1.25px}
#locate b.e{right:7px;top:50%;width:6px;height:2.5px;margin-top:-1.25px}
#locate.on i,#locate.on b{border-color:#EE1D74;background-color:#EE1D74}
#locate.on i{background:transparent}
#locate.on i:after{background:#EE1D74}
/* Карта не загрузилась (нет токена / сети) — родитель покажет свою заглушку, здесь только подпись. */
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#6B6873;font-size:14px;line-height:1.4}
</style></head>
<body>
<div id="map"></div>
<div id="pin" hidden><div class="head"><span class="dot"></span><svg class="spin" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="arc" cx="12" cy="12" r="9"/></svg></div><div class="leg"></div></div>
<div id="shadow" hidden></div>
<div id="fail" hidden>Карта недоступна — укажите адрес вручную</div>
<div id="ctl"><button type="button" id="zin" aria-label="Приблизить"><span class="h"></span><span class="v"></span></button><button type="button" id="zout" aria-label="Отдалить"><span class="h"></span></button><button type="button" id="locate" aria-label="Моё местоположение" title="Моё местоположение"><i></i><b class="n"></b><b class="s"></b><b class="w"></b><b class="e"></b></button></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var post = function (m) { parent.postMessage(Object.assign({ src: '8mart-map', id: q.get('id') || '' }, m), location.origin); };
  if (q.get('compact') === '1') document.body.classList.add('compact');
  var token = q.get('token') || '';
  function fail() {
    document.getElementById('fail').hidden = false;
    document.getElementById('ctl').hidden = true;
    post({ type: 'error' });
  }
  if (!token || typeof mapboxgl === 'undefined' || !mapboxgl.supported || !mapboxgl.supported()) { fail(); return; }

  var state = { mode: q.get('mode') || 'delivery', lat: +q.get('lat') || 51.1282, lng: +q.get('lng') || 71.4307, zoom: +q.get('zoom') || 15, points: [], selected: q.get('selected') || null };
  mapboxgl.accessToken = token;
  var map;
  try {
    map = new mapboxgl.Map({ container: 'map', style: 'mapbox://styles/mapbox/streets-v12', center: [state.lng, state.lat], zoom: state.zoom, language: 'ru', attributionControl: true, logoPosition: 'bottom-left', dragRotate: false, pitchWithRotate: false });
  } catch (e) { fail(); return; }
  map.on('error', function (e) { if (e && e.error && (e.error.status === 401 || e.error.status === 403)) fail(); });
  map.touchZoomRotate.disableRotation();

  var pin = document.getElementById('pin'), shadow = document.getElementById('shadow');
  // Лоадер в пине — пока определяем адрес; сам адрес показывает поле под картой.
  function busy(on) { pin.classList.toggle('busy', !!on); }
  var markers = [];
  function fitPoints() {
    var pts = state.points.map(function (p) { return [p.lng, p.lat]; });
    if (pts.length === 1) { map.easeTo({ center: pts[0], zoom: 15 }); return; }
    var b = pts.reduce(function (b, p) { return b.extend(p); }, new mapboxgl.LngLatBounds(pts[0], pts[0]));
    map.fitBounds(b, { padding: 60, maxZoom: 15 });
  }
  function applyMode() {
    var d = state.mode === 'delivery';
    pin.hidden = !d; shadow.hidden = !d;
    markers.forEach(function (m) { m.remove(); }); markers = [];
    if (!d) state.points.forEach(function (p) {
      var el = document.createElement('button'); el.type = 'button';
      el.className = 'pp' + (p.id === state.selected ? ' sel' : ''); el.innerHTML = '<span></span>';
      el.setAttribute('aria-label', p.name); el.setAttribute('aria-pressed', String(p.id === state.selected));
      el.addEventListener('click', function (e) { e.stopPropagation(); state.selected = p.id; applyMode(); post({ type: 'pick', pointId: p.id }); });
      markers.push(new mapboxgl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(map));
    });
  }
  var t, req = 0, quiet = false, lastKey = '';
  // Изменение размера карты (панель модалки стала выше/ниже) — не перемещение: адрес по пину заново не определяем.
  var resizing = false;
  map.on('resize', function () { resizing = true; });
  map.on('movestart', function () { if (resizing) return; pin.classList.add('lift'); shadow.classList.add('lift'); if (state.mode === 'delivery' && !quiet) busy(true); });
  map.on('moveend', function () {
    pin.classList.remove('lift'); shadow.classList.remove('lift');
    if (resizing) { resizing = false; return; }
    if (state.mode !== 'delivery') return;
    var c = map.getCenter();
    // Выбор подсказки: пин ставится без повторного геокодирования.
    // Та же точка, что в прошлый раз (повторный moveend без сдвига) — адрес уже известен, DaData не дёргаем.
    var key = c.lat.toFixed(5) + ',' + c.lng.toFixed(5);
    if (quiet) { quiet = false; lastKey = key; busy(false); return; }
    if (key === lastKey) { busy(false); return; }
    lastKey = key;
    clearTimeout(t); post({ type: 'moving' });
    t = setTimeout(function () { reverse(c); }, 400);
  });
  function reverse(c) {
    var my = ++req;
    fetch('/api/geo/reverse?' + new URLSearchParams({ lat: String(c.lat), lng: String(c.lng) }))
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (a) {
        if (my !== req) return;
        var street = (a && a.address) || '';
        busy(false);
        post({ type: 'address', lat: c.lat, lng: c.lng, street: street, city: (a && a.city) || '', hasHouse: !!(a && a.hasHouse) });
      })
      .catch(function () {
        if (my !== req) return;
        lastKey = ''; // ошибка — при следующем движении на ту же точку попробуем снова
        busy(false);
        post({ type: 'address', lat: c.lat, lng: c.lng, street: '', city: '', failed: true });
      });
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || e.source !== parent) return;
    var m = e.data || {}; if (m.src !== '8mart-parent') return;
    if (m.mode) state.mode = m.mode;
    if (m.points) state.points = m.points;
    if ('selected' in m) state.selected = m.selected;
    if (m.quiet) { quiet = true; setTimeout(function () { quiet = false; }, 4000); }
    if (m.lat && m.lng) map.flyTo({ center: [m.lng, m.lat], zoom: m.zoom || map.getZoom(), speed: 1.6 });
    if (m.locate) loc.click();
    if (m.fit && state.points.length) fitPoints();
    applyMode();
  });
  document.getElementById('zin').onclick = function () { map.zoomIn(); };
  document.getElementById('zout').onclick = function () { map.zoomOut(); };
  var loc = document.getElementById('locate'), me = null;
  loc.onclick = function () {
    if (!navigator.geolocation) return;
    loc.classList.add('on');
    navigator.geolocation.getCurrentPosition(function (p) {
      var ll = [p.coords.longitude, p.coords.latitude];
      post({ type: 'geo', lat: ll[1], lng: ll[0] });
      if (state.mode === 'delivery') map.flyTo({ center: ll, zoom: 16 });
      else { if (me) me.remove(); var el = document.createElement('div'); el.className = 'me'; me = new mapboxgl.Marker({ element: el }).setLngLat(ll).addTo(map); }
    }, function () { loc.classList.remove('on'); });
  };
  applyMode();
  // ?quiet=<адрес> — стартовый адрес уже известен (initial), обратное геокодирование при загрузке не делаем.
  var initial = q.get('quiet') || '';
  
  map.on('load', function () {
    post({ type: 'ready' });
    var c = map.getCenter(); lastKey = c.lat.toFixed(5) + ',' + c.lng.toFixed(5); // стартовая точка — её адрес определяем один раз (или он уже известен)
    if (state.mode === 'delivery' && !initial) { busy(true); post({ type: 'moving' }); reverse(c); }
  });
})();
</script>
</body></html>
